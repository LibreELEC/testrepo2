name: Create Pull Request from Fork
on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: 'Title for the pull request'
        required: false
        default: 'Merge LibreELEC/workflows:master into test123'
      pr_body:
        description: 'Body for the pull request'
        required: false
        default: 'Automated PR created by workflow'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      # Avoid relying on github.context.payload inside the script (can be undefined in some contexts).
      PR_TITLE: ${{ github.event.inputs.pr_title || 'Merge LibreELEC/workflows:master into test123' }}
      PR_BODY: ${{ github.event.inputs.pr_body || 'Automated PR created by workflow' }}
      TARGET_OWNER: LibreELEC
      TARGET_REPO: testrepo2
      TARGET_BASE: test123
      SOURCE_HEAD: LibreELEC:master

    steps:
      - name: Create PR (if one doesn't already exist)
        uses: actions/github-script@v6
        with:
          script: |
            const owner = process.env.TARGET_OWNER;
            const repo = process.env.TARGET_REPO;
            const base = process.env.TARGET_BASE;
            const head = process.env.SOURCE_HEAD;
            const title = process.env.PR_TITLE;
            const body = process.env.PR_BODY;

            // First check for an existing open PR with same head and base
            try {
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head, // "owner:branch"
                base
              });

              if (existing.data && existing.data.length > 0) {
                console.log(`Existing open PR found: ${existing.data[0].html_url}`);
                core.setOutput('pr_url', existing.data[0].html_url);
                core.setOutput('pr_number', existing.data[0].number.toString());
                return;
              }
            } catch (err) {
              // Non-fatal: continue to try creating PR, but print details for debugging
              console.warn('Warning checking existing PRs:', err && err.message ? err.message : err);
            }

            // Create the PR
            try {
              const res = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head, // e.g. "LibreELEC:master"
                base,
                body
              });
              console.log('PR created:', res.data.html_url);
              core.setOutput('pr_url', res.data.html_url);
              core.setOutput('pr_number', res.data.number.toString());
            } catch (err) {
              // Enrich error message when possible
              console.error('Failed to create PR. Error details:', err && err.response && err.response.data ? err.response.data : err);
              throw err;
            }
